[package]
name = "wreq_rb"
version = "0.6.2"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = "0.9"
wreq = { path = "../../vendor/wreq", version = "=0.16.1", features = [
  "cookies",
  "json",
  "gzip",
  "brotli",
  "zstd",
  "deflate",
  "socks",
  "multipart",
  "charset",
  "stream",
  "query",
  "form",
] }
wreq-util = { version = "=0.2.0", features = ["emulation", "emulation-serde", "emulation-compression"] }
# Not "full": its parking_lot feature keeps a process-global lock table that a fork can copy mid-update,
# deadlocking the child on its first request.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
serde_json = "1.0"
bytes = "1"
http = "1"

[dev-dependencies]
magnus = { version = "0.8", features = ["embed"] }

[target.'cfg(target_os = "linux")'.dependencies]
wreq = { path = "../../vendor/wreq", version = "=0.16.1", features = [
  "prefix-symbols",
] }
